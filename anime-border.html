<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6Anime-border</title>
    <style>
        body {
            background-color: rgb(73, 55, 55);
        }

        .container {
            width: 90vw;
            height: 90vh;
            /* background-color: wheat; */
            display: grid;
            place-items: center;
        }

        .box {
            width: 250px;
            aspect-ratio: 1;
            /* border: 1px solid rgb(165, 40, 40); */
            background-color: rgb(31, 31, 38);
            box-sizing: border-box;
            border-radius: 10px;
            position: relative;
        }

        h3 {
            color: white;
            padding-top: 20px;
            text-align: center;
        }

        p {
            color: rgb(255, 255, 255, .5);
            padding: 10px 20px;
            text-align: justify;
        }

        @property --angle{

            syntax: "<angle>";
            initial-value: 90deg;
            inherits: false;

        }

        .box::after,
        .box::before {
            /* --angle:90deg; */
            content: '';
            width: 100%;
            height: 100%;
            /* background-color: red; */
            /* background: conic-gradient(#ff4545,#00ff99,#006aff,#ff0095,#ff4545); */
            /* background: conic-gradient(from var(--angle),transparent 25%,#ff4545,#00ff99,#006aff,#ff0095,#ff4545); */
            background: conic-gradient(from var(--angle),transparent 50%, blue);
           
          

            position: absolute;
            top: 50%;
            left: 50%;
            padding: 5px;
            z-index: -1;
            translate: -50% -50%;
            border-radius: 10px;
            animation: anime;
            animation-duration: 10s;
            animation-timing-function: linear;

            animation-iteration-count: infinite;

        }

        .box::before {
            filter: blur(.6rem);
            opacity: .3;

            /* background: conic-gradient(transparent 90%, red); */


        }


        @keyframes anime {
            from{
                --angle:0deg;
            }
            to{
                --angle:360deg;
            }



        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <h3>Dear Zindagi</h3>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Expedita assumenda qui, iure incidunt porro
                itaque dignissimos quibusdam? Eos omnis magni, consequatur qui possimus non expedita aut sapiente
                mollitia quasi minima?</p>
        </div>
    </div>

</body>

</html>
